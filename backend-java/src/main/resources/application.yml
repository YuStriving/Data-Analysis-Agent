spring:
  profiles:
    active: dev
  application:
    name: backend-java
  datasource:
    url: jdbc:mysql://localhost:3306/data_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${config.db.password:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: DataAgentHikariCP
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${config.redis.password:root}
      database: 0
      timeout: 5s
      connect-timeout: 5s

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.dataagent.platform.modules.auth.domain.po
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.dataagent.platform.modules.auth.domain.po
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    jdbc-type-for-null: "NULL"
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      insert-strategy: not_null
      update-strategy: not_null
      where-strategy: not_null

server:
  port: 8080

logging:
  file:
    name: logs/backend-java/backend-java.log
  level:
    root: INFO
    com.dataagent.platform: INFO
    com.dataagent.platform.modules.auth: DEBUG
    org.mybatis: INFO
    com.baomidou.mybatisplus: INFO
    com.zaxxer.hikari: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  jwt:
    algorithm: RS256
    private-key-path: classpath:keys/jwt-private.pem
    public-key-path: classpath:keys/jwt-public.pem
    access-token-expire: 15m
    refresh-token-expire: 7d
    issuer: data-agent-backend
    header: Authorization
    prefix: Bearer
  session:
    refresh-token-cookie-name: data-analysis-agent-refresh-token
    refresh-token-cookie-path: /api/auth
    refresh-token-cookie-secure: false
    refresh-token-cookie-same-site: Lax
    inactivity-timeout: 48h

storage:
  oss:
    endpoint: ${config.storage.oss.endpoint}
    bucket: ${config.storage.oss.bucket}
    access-key-id: ${config.storage.oss.access-key-id}
    access-key-secret: ${config.storage.oss.access-key-secret}
    public-domain: ${config.storage.oss.public-domain}
    upload-prefixes:
      csv: ${config.storage.oss.upload-prefixes.csv:datasets/csv}
      xlsx: ${config.storage.oss.upload-prefixes.xlsx:datasets/xlsx}
      xls: ${config.storage.oss.upload-prefixes.xls:datasets/xls}
