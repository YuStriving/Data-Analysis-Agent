[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-agent"
version = "0.1.0"
description = "LangGraph-powered data analysis agent backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "langgraph>=0.6.6",
  "langchain-openai>=0.3.30",
  "pydantic>=2.11.7",
  "pymongo>=4.10.1",
  "redis>=6.4.0",
  "sqlalchemy>=2.0.43",
  "uvicorn>=0.35.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.1",
  "ruff>=0.12.9"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_backend.capabilities.data_analysis" = ["prompts/**/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

