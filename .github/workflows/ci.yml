name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-web:
    name: frontend-web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend-java:
    name: backend-java
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend-java

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate test JWT keys
        run: |
          mkdir -p src/main/resources/keys
          openssl genrsa -out src/main/resources/keys/jwt-private.pem 2048
          openssl rsa -in src/main/resources/keys/jwt-private.pem -pubout -out src/main/resources/keys/jwt-public.pem

      - name: Test
        run: mvn -B test

  backend-agent:
    name: backend-agent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-agent/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: >
          ruff check
          src/agent_backend/foundation/llm
          src/agent_backend/capabilities/data_analysis/tools/__init__.py
          src/agent_backend/capabilities/data_analysis/tools/runtime.py
          src/agent_backend/orchestration/data_analysis/graph.py
          tests/unit/test_llm_settings.py
          tests/unit/test_openai_compatible_llm_adapter.py
          tests/unit/test_data_analysis_graph.py
          tests/unit/test_data_analysis_tool_runtime.py

      - name: Test
        run: >
          pytest
          tests/unit/test_llm_settings.py
          tests/unit/test_openai_compatible_llm_adapter.py
          tests/unit/test_data_analysis_graph.py
          tests/unit/test_data_analysis_tool_runtime.py
